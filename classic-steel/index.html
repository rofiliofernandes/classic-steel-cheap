<style>html{background:#f7f4eb}html[data-theme="dark"]{background:#000}html[data-theme="light"]{background:#f7f4eb}body{margin:0}</style>
<script>
(function(){
  try{document.documentElement.setAttribute('data-theme',localStorage.getItem('ip-theme')==='dark'?'dark':'light')}catch(e){document.documentElement.setAttribute('data-theme','light')}
  var h=location.hostname,p=location.pathname;
  if(h.indexOf('admin.')!==0&&p.indexOf('/admin')!==0){
    window.__earlyPublic=fetch('/api/public').then(function(r){if(!r.ok)throw new Error('early fetch failed');return r.json()});
    window.__earlyPublic.catch(function(){});
  }
})();
</script>
