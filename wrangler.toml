.name = "classic-steel-cheap"
main = "src/worker.ts"
compatibility_date = "2026-09-05"
workers_dev = true
keep_vars = true

[assets]
directory = "./dist/client"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/media/*"]

[[d1_databases]]
binding = "DB"
database_name = "classic-steel-db"
# Replace with the id printed by: npx wrangler d1 create capital-upvc-db
database_id = "83c4ad4a-2f93-4e05-aa2b-be7997a1c316"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
# Create with: npx wrangler r2 bucket create capital-upvc-media
bucket_name = "classic-steel-media"

[vars]
SITE_NAME = "Classic Steel"
PHONE = "8449243465"
MAPS_URL = "https://maps.app.goo.gl/MStEk8sBR9QoNXGu7"
STORAGE_LIMIT_GB = "5"
ADMIN_HOST = "classicsteelfabrication.in"
INSTAGRAM_REDIRECT_URI = "https://classicsteelfabrication.in/api/instagram/callback"
INSTAGRAM_GRAPH_VERSION = "v24.0"
RESEND_FROM_EMAIL = ""
INSTAGRAM_APP_ID = "29282313471432868"
INSTAGRAM_CONFIG_ID = "1458056229804690"

[triggers]
# Twice a day: sync Instagram photos/videos and download any queued videos.
crons = ["0 0,12 * * *"]

[observability]
enabled = true
head_sampling_rate = 1
