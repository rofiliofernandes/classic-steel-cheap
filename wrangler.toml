name = "classic-steel-cheap"
main = "src/worker.ts"
compatibility_date = "2026-09-05"
workers_dev = true
keep_vars = true

[assets]
directory = "./dist/client"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/media/*"]

[[d1_databases]]
binding = "DB"
database_name = "classic-steel-db"
database_id = "83c4ad4a-2f93-4e05-aa2b-be7997a1c316"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "classic-steel-media"


[vars]
SITE_NAME = "Classic Steel"
PHONE = "REPLACE_WITH_CLIENT_PHONE"
MAPS_URL = "REPLACE_WITH_CLIENT_MAPS_URL"
ADMIN_HOST = "classic-steel-cheap.rofitest8.workers.dev"
GOOGLE_PLACE_ID = ""
INSTAGRAM_APP_ID = ""
INSTAGRAM_REDIRECT_URI = "https://classic-steel-cheap.rofitest8.workers.dev/api/instagram/callback"
INSTAGRAM_GRAPH_VERSION = "v24.0"
ADMIN_OWNER_EMAIL = ""
RESEND_FROM_EMAIL = "Classic Steel <admin@your-verified-domain.com>"

[triggers]
crons = ["0 0,12 * * *"]

[observability]
enabled = true
head_sampling_rate = 1

