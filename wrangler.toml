name = "capital-upvc"
main = "src/worker.ts"
compatibility_date = "2026-09-05"
workers_dev = true
keep_vars = true

[assets]
directory = "./dist/client"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/media/*"]

[[d1_databases]]
binding = "DB"
database_name = "capital-upvc-db"
# Replace with the id printed by: npx wrangler d1 create capital-upvc-db
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
# Create with: npx wrangler r2 bucket create capital-upvc-media
bucket_name = "capital-upvc-media"

[vars]
SITE_NAME = "Capital UPVC Windows & Doors"
PHONE = "7048235723"
MAPS_URL = "https://maps.app.goo.gl/MStEk8sBR9QoNXGu7"
# Total storage allowed for uploaded/downloaded photos and videos (in GB).
STORAGE_LIMIT_GB = "10"
# Set these once your domain is connected, e.g. admin.capitalupvc.com
ADMIN_HOST = ""
INSTAGRAM_APP_ID = ""
INSTAGRAM_REDIRECT_URI = ""
INSTAGRAM_GRAPH_VERSION = "v24.0"
RESEND_FROM_EMAIL = ""

[triggers]
# Twice a day: sync Instagram photos/videos and download any queued videos.
crons = ["0 0,12 * * *"]

[observability]
enabled = true
head_sampling_rate = 1
